[client]
showErrorDetails = true
toolbarMode = "minimal"

[theme]
primaryColor = "#0d6efd"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false
