<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Réussite - Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0d6efd;
      --primary-dark: #0b5ed7;
      --success: #198754;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #0dcaf0;
      --light: #f8f9fa;
      --dark: #212529;
      --border: #dee2e6;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
      --radius: 12px;
      --transition: 0.3s cubic-bezier(0.23, 1, 0.320, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--dark);
      line-height: 1.6;
    }

    .app-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ===== HEADER ===== */
    .header {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideDown 0.5s ease-out;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #0b5ed7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(13, 110, 253, 0.3);
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #6c757d;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Sora', sans-serif;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--light);
      color: var(--dark);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    .btn-success {
      background: var(--success);
    }

    .btn-success:hover {
      background: #157347;
    }

    /* ===== PAGES ===== */
    .pages {
      position: relative;
      min-height: 600px;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity var(--transition), transform var(--transition);
      pointer-events: none;
    }

    .page.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ===== HOME PAGE ===== */
    .home-page {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .home-page h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--dark);
    }

    .home-page p {
      font-size: 16px;
      color: #6c757d;
      margin-bottom: 32px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .tabs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--light);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: var(--transition);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-btn:hover {
      color: var(--dark);
    }

    .tab-panels {
      position: relative;
      min-height: 300px;
      margin-top: 24px;
    }

    .tab-panel {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity var(--transition), transform var(--transition);
      pointer-events: none;
    }

    .tab-panel.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .quiz-selector {
      display: grid;
      gap: 16px;
    }

    .quiz-selector select {
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Sora', sans-serif;
      background: white;
      cursor: pointer;
      transition: var(--transition);
    }

    .quiz-selector select:hover,
    .quiz-selector select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .quiz-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .quiz-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .quiz-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(13, 110, 253, 0.2);
    }

    .quiz-card strong {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .quiz-card .subtitle {
      font-size: 12px;
      color: #6c757d;
    }

    /* ===== QUIZ PAGE ===== */
    .quiz-page {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      border-bottom: 2px solid var(--light);
      padding-bottom: 16px;
    }

    .quiz-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark);
    }

    .quiz-progress {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar {
      width: 200px;
      height: 6px;
      background: var(--light);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #0b5ed7);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 600;
      color: #6c757d;
      min-width: 50px;
    }

    .question-box {
      background: var(--light);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .question-number {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .option-label:hover {
      border-color: var(--primary);
      background: rgba(13, 110, 253, 0.02);
    }

    .option-label input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .option-label input[type="radio"],
    .option-label input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .option-text {
      flex: 1;
      font-size: 15px;
      color: var(--dark);
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    /* ===== RESULTS PAGE ===== */
    .results-page {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }

    .result-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .result-score {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), #0b5ed7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-message {
      font-size: 18px;
      color: #6c757d;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .result-item {
      background: var(--light);
      border-left: 4px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .result-item.correct {
      border-left-color: var(--success);
      background: rgba(25, 135, 84, 0.05);
    }

    .result-item.incorrect {
      border-left-color: var(--danger);
      background: rgba(220, 53, 69, 0.05);
    }

    .result-question {
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .result-status {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .result-status.correct {
      background: var(--success);
      color: white;
    }

    .result-status.incorrect {
      background: var(--danger);
      color: white;
    }

    .result-answers {
      font-size: 14px;
      color: #6c757d;
      margin-top: 8px;
    }

    .result-explanation {
      background: rgba(13, 110, 253, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      padding: 12px;
      margin-top: 12px;
      font-size: 14px;
      color: var(--dark);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6c757d;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .quiz-page {
        padding: 20px;
      }

      .tabs {
        flex-wrap: wrap;
        justify-content: center;
      }

      .quiz-cards {
        grid-template-columns: 1fr;
      }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: white;
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s ease-out;
      z-index: 1000;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 4px solid var(--light);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="logo">📚</div>
        <div class="header-title">
          <h1>Campus Réussite</h1>
          <div class="header-subtitle">Révision en ligne gratuite</div>
        </div>
      </div>
    </div>

    <!-- PAGES -->
    <div class="pages">
      <!-- HOME PAGE -->
      <section id="homePage" class="page active">
        <div class="home-page">
          <h2>Bienvenue sur Campus Réussite</h2>
          <p>Revise gratuitement avec nos quiz interactifs. Choisis une série et commence.</p>

          <div class="tabs">
            <button class="tab-btn active" data-tab="series">🎯 Choisir une série</button>
          </div>

          <div class="tab-panels">
            <!-- SERIES TAB -->
            <div id="tab-series" class="tab-panel active">
              <div class="quiz-selector">
                <select id="quizSelector">
                  <option value="">-- Sélectionnez une série --</option>
                </select>
                <div id="quizCards" class="quiz-cards"></div>
              </div>
              <div style="text-align: center; margin-top: 24px;">
                <button class="btn" id="startBtn" disabled>Commencer le quiz</button>
              </div>
              <div id="noQuizzes" class="empty-state" style="display: none;">
                <div class="empty-state-icon">🎯</div>
                <div class="empty-state-text">Aucun quiz disponible pour le moment</div>
              </div>
              <div id="loadingQuizzes" class="loading" style="display: none;">
                <div class="spinner"></div>
                <div>Chargement des quiz...</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- QUIZ PAGE -->
      <section id="quizPage" class="page">
        <div class="quiz-page">
          <div class="quiz-header">
            <div class="quiz-title" id="quizTitle">Quiz</div>
            <div class="quiz-progress">
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="progress-text"><span id="progressCurrent">0</span>/<span id="progressTotal">0</span></div>
            </div>
          </div>

          <div id="questionContainer" class="question-box"></div>

          <div class="nav-buttons">
            <button class="btn btn-secondary" id="prevBtn" style="display: none;">← Précédent</button>
            <button class="btn" id="nextBtn" style="display: none;">Suivant →</button>
            <button class="btn btn-success" id="submitBtn" style="display: none;">✓ Soumettre</button>
          </div>
        </div>
      </section>

      <!-- RESULTS PAGE -->
      <section id="resultsPage" class="page">
        <div class="results-page">
          <div class="result-header">
            <div class="result-score" id="finalScore">0/0</div>
            <div class="result-message" id="resultMessage">Quiz terminé!</div>
          </div>

          <div id="resultsList" class="results-list"></div>

          <div style="text-align: center; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-secondary" id="retryBtn">🔄 Recommencer</button>
            <button class="btn" id="goHomeBtn">🏠 Accueil</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ===== CONFIGURATION =====
    const API_ENDPOINT_KEY = 'campus_api_endpoint';
    const SCORES_KEY = 'scores';
    
    // URL où récupérer les quiz (à configurer)
    let API_ENDPOINT = localStorage.getItem(API_ENDPOINT_KEY) || 
      'https://raw.githubusercontent.com/YOUR-USERNAME/campus-reussite-api/main/data.json';

    // ===== STATE =====
    let currentQuiz = null;
    let currentQuizTitle = '';
    let currentIndex = 0;
    let userAnswers = [];
    let quizzes = {};
    let finished = false;

    // ===== DOM ELEMENTS =====
    const homePage = document.getElementById('homePage');
    const quizPage = document.getElementById('quizPage');
    const resultsPage = document.getElementById('resultsPage');
    const quizSelector = document.getElementById('quizSelector');
    const startBtn = document.getElementById('startBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const questionContainer = document.getElementById('questionContainer');

    // ===== UTILITIES =====
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      page.classList.add('active');
    }

    async function loadQuizzesFromAPI() {
      document.getElementById('loadingQuizzes').style.display = 'block';
      document.getElementById('noQuizzes').style.display = 'none';
      
      try {
        const response = await fetch(API_ENDPOINT);
        const data = await response.json();
        quizzes = data.quizzes || {};
        
        document.getElementById('loadingQuizzes').style.display = 'none';
        
        if (Object.keys(quizzes).length === 0) {
          document.getElementById('noQuizzes').style.display = 'block';
          return;
        }

        document.getElementById('noQuizzes').style.display = 'none';
        renderQuizList();
      } catch (error) {
        console.error('Erreur chargement API:', error);
        document.getElementById('loadingQuizzes').style.display = 'none';
        document.getElementById('noQuizzes').style.display = 'block';
        document.getElementById('noQuizzes').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <div>Erreur de chargement des quiz</div>
            <div style="font-size: 13px; color: #6c757d; margin-top: 8px;">
              Vérifiez que l'API est accessible:<br>
              <code style="font-size: 11px;">${API_ENDPOINT}</code>
            </div>
          </div>
        `;
      }
    }

    function renderQuizList() {
      const quizKeys = Object.keys(quizzes);
      
      quizSelector.innerHTML = '<option value="">-- Sélectionnez une série --</option>';
      const quizCards = document.getElementById('quizCards');
      quizCards.innerHTML = '';

      quizKeys.forEach(title => {
        const option = document.createElement('option');
        option.value = title;
        option.textContent = title;
        quizSelector.appendChild(option);

        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
          <strong>${title}</strong>
          <div class="subtitle">${quizzes[title].length} question(s)</div>
        `;
        card.onclick = () => {
          quizSelector.value = title;
          startBtn.disabled = false;
        };
        quizCards.appendChild(card);
      });
    }

    function renderQuestion(index) {
      const q = currentQuiz[index];
      const isMultiple = Array.isArray(q.correct) && q.correct.length > 1;

      let optionsHtml = '';
      ['A', 'B', 'C', 'D'].forEach(letter => {
        const isSelected = userAnswers[index]?.includes(letter);
        optionsHtml += `
          <label class="option-label">
            <input type="${isMultiple ? 'checkbox' : 'radio'}" name="q${index}" value="${letter}" ${isSelected ? 'checked' : ''}>
            <span class="option-text"><strong>${letter}.</strong> ${q.options[letter]}</span>
          </label>
        `;
      });

      questionContainer.innerHTML = `
        <div class="question-number">Question ${index + 1} sur ${currentQuiz.length}</div>
        <div class="question-text">${q.question}</div>
        <div class="options">${optionsHtml}</div>
      `;

      const inputs = document.querySelectorAll(`input[name="q${index}"]`);
      inputs.forEach(input => {
        input.addEventListener('change', () => {
          if (input.type === 'radio') {
            userAnswers[index] = [input.value];
          } else {
            const checked = Array.from(inputs).filter(i => i.checked).map(i => i.value);
            userAnswers[index] = checked;
          }
          updateNavigation();
        });
      });

      updateNavigation();
      updateProgress();
    }

    function updateProgress() {
      const progress = ((currentIndex + 1) / currentQuiz.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressCurrent').textContent = currentIndex + 1;
      document.getElementById('progressTotal').textContent = currentQuiz.length;
    }

    function updateNavigation() {
      const hasAnswer = userAnswers[currentIndex]?.length > 0;
      const isLast = currentIndex === currentQuiz.length - 1;
      
      prevBtn.style.display = currentIndex > 0 ? 'inline-block' : 'none';
      nextBtn.style.display = isLast ? 'none' : 'inline-block';
      submitBtn.style.display = isLast ? 'inline-block' : 'none';
      
      nextBtn.disabled = !hasAnswer;
      submitBtn.disabled = !hasAnswer;
    }

    function getCorrectAnswers(question) {
      return Array.isArray(question.correct) ? question.correct : [question.correct];
    }

    function scoreAnswer(correctAnswers, userAnswer) {
      const correct = new Set(correctAnswers);
      const user = new Set(userAnswer || []);

      if (correct.size === 1) {
        return user.size === 1 && user.has(Array.from(correct)[0]) ? 1 : 0;
      } else {
        let correctCount = 0;
        user.forEach(ans => {
          if (correct.has(ans)) correctCount++;
        });
        
        let score = correctCount / correct.size;
        user.forEach(ans => {
          if (!correct.has(ans)) score -= 0.5 / correct.size;
        });
        
        return Math.max(0, score);
      }
    }

    function submitQuiz() {
      questionContainer.innerHTML = '';
      
      let totalScore = 0;
      let resultsHtml = '';

      currentQuiz.forEach((q, idx) => {
        const correctAnswers = getCorrectAnswers(q);
        const userAnswer = userAnswers[idx] || [];
        const score = scoreAnswer(correctAnswers, userAnswer);
        totalScore += score;

        const isCorrect = score === 1;
        const isIncorrect = score === 0;
        const statusClass = isCorrect ? 'correct' : 'incorrect';
        const statusText = isCorrect ? '✓ Correct' : '✗ Incorrect';

        resultsHtml += `
          <div class="result-item ${statusClass}">
            <div class="result-question">Q${idx + 1}. ${q.question}</div>
            <div class="result-status ${statusClass}">${statusText}</div>
            <div class="result-answers">
              <strong>Réponse(s) correcte(s):</strong> ${correctAnswers.join(', ')}<br>
              <strong>Votre réponse:</strong> ${userAnswer.length > 0 ? userAnswer.join(', ') : 'Pas de réponse'}
            </div>
            <div class="result-explanation">💡 ${q.explanation || 'Explication non disponible'}</div>
          </div>
        `;
      });

      const finalScore = Math.round(totalScore);
      const percentage = Math.round((totalScore / currentQuiz.length) * 100);
      
      document.getElementById('finalScore').textContent = `${finalScore}/${currentQuiz.length}`;
      document.getElementById('resultMessage').textContent = 
        percentage >= 80 ? '🎉 Excellent travail!' :
        percentage >= 60 ? '👍 Bonne performance!' :
        percentage >= 40 ? '📚 Continuez vos révisions!' :
        '💪 Encore un effort!';

      document.getElementById('resultsList').innerHTML = resultsHtml;

      const scores = JSON.parse(localStorage.getItem(SCORES_KEY) || '{}');
      if (!scores[currentQuizTitle]) scores[currentQuizTitle] = [];
      scores[currentQuizTitle].push({
        date: new Date().toISOString(),
        score: finalScore,
        total: currentQuiz.length
      });
      localStorage.setItem(SCORES_KEY, JSON.stringify(scores));

      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      submitBtn.style.display = 'none';
      finished = true;

      showPage(resultsPage);
    }

    // ===== EVENT LISTENERS =====
    startBtn.addEventListener('click', () => {
      const title = quizSelector.value;
      if (!title) return;

      currentQuizTitle = title;
      currentQuiz = quizzes[title] || [];
      currentIndex = 0;
      userAnswers = Array(currentQuiz.length).fill(null).map(() => []);
      finished = false;

      document.getElementById('quizTitle').textContent = title;
      showPage(quizPage);
      renderQuestion(0);
    });

    prevBtn.addEventListener('click', () => {
      currentIndex--;
      renderQuestion(currentIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      renderQuestion(currentIndex);
    });

    submitBtn.addEventListener('click', submitQuiz);

    document.getElementById('retryBtn').addEventListener('click', () => {
      currentIndex = 0;
      userAnswers = Array(currentQuiz.length).fill(null).map(() => []);
      finished = false;
      showPage(quizPage);
      renderQuestion(0);
    });

    document.getElementById('goHomeBtn').addEventListener('click', () => {
      showPage(homePage);
    });

    quizSelector.addEventListener('change', () => {
      startBtn.disabled = !quizSelector.value;
    });

    // ===== INITIAL LOAD =====
    loadQuizzesFromAPI();
  </script>
</body>
</html>
